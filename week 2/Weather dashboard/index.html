<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="search-bar">
    <h1>Weather App</h1>
    <input type="text" id="search" placeholder="Enter a city name">
    <button id="search-btn" type="button">Search
    </button>
    </div>
    <section id="current-weather">
       
      <h2>City name</h2>  
      <p>Temperature</p>
      <p>Wind speed</p>
    </section>
    <div id="forecast">
        <h2>5-Day Forecast</h2>
        <div id="forecast-list"></div>
       
        <section id="recent-search">
            <h2>Recent searches</h2>
            <div id="recent-list"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
